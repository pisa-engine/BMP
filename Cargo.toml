[package]
name = "bmp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ciff2bmp"
path = "bin/ciff2bmp.rs"

[[bin]]
name = "search"
path = "bin/search.rs"

[dependencies]
protobuf = "^2.27"
structopt = "0.3"
anyhow = "1.0"
indicatif = "0.15"
num-traits = "0"
bincode = "1.3.3"
serde = { version = "1.0.193", features = ["derive"] }
fst = "0.4.7"
num-integer = "0.1.45"
rayon = "1.8.0"
# High-performance computing additions
wide = "0.7"              # SIMD operations
blas = "0.23"             # BLAS operations
sprs = "0.11"             # Sparse matrix operations
arrayfire = { version = "3.8", optional = true }  # GPU acceleration
simdeez = "1.0"           # Cross-platform SIMD

# Use Accelerate on macOS (fast, no compilation)
[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.11", default-features = false, features = ["accelerate"] }

# Use OpenBLAS on other platforms
[target.'cfg(not(target_os = "macos"))'.dependencies]
openblas-src = { version = "0.10", features = ["cblas", "system"] }

[build-dependencies]
protobuf-codegen-pure = "2.22"

[features]
default = []
gpu = ["arrayfire"]
